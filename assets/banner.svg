 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#22D3EE" stroke-opacity=".045"/></pattern>
 <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
 <clipPath id="clip"><rect width="1280" height="320" rx="22"/></clipPath>
</defs>
<rect width="1280" height="320" rx="22" fill="url(#bg)"/>
<rect width="1280" height="320" rx="22" fill="url(#grid)"/>
